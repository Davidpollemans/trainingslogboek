<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#16150F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="referrer" content="no-referrer" />
  <meta name="apple-mobile-web-app-title" content="Training" />
  <meta name="description" content="Mobiel trainingslogboek met lokale opslag en export." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <title>Trainingslogboek</title>
  <style>html,body,#root{margin:0;min-height:100%;background:#16150F}body{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}#root{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}</style>
</head>
<body>
  <div id="root"></div>
  <noscript style="color:#F2EDE0;font:16px system-ui;display:block;padding:24px">Deze app heeft JavaScript nodig.</noscript>
  <script>
    // Laat een leesbare melding zien in plaats van een zwart scherm.
    window.__boot = function (msg) {
      var r = document.getElementById("root");
      if (r && !r.firstChild)
        r.innerHTML = '<div style="color:#EDE8DA;font:14px/1.6 -apple-system,system-ui,sans-serif;padding:24px">'
          + '<strong style="display:block;font-size:17px;margin-bottom:10px">De app kon niet starten</strong>'
          + '<div style="color:#96907E;white-space:pre-wrap;word-break:break-word">' + String(msg) + '</div></div>';
    };
    window.addEventListener("error", function (e) { window.__boot((e.message || "onbekende fout") + (e.filename ? "\n" + e.filename + ":" + e.lineno : "")); });
    window.addEventListener("unhandledrejection", function (e) { window.__boot(e.reason && e.reason.message ? e.reason.message : e.reason); });
    setTimeout(function () { window.__boot("De app reageerde niet binnen 12 seconden. Controleer je internetverbinding \u2014 de eerste start haalt React en Recharts van het net."); }, 12000);
  </script>
  <script type="module">
    import React from "https://esm.sh/react@19.1.1";
    import { createRoot } from "https://esm.sh/react-dom@19.1.1/client";
    import Trainingslogboek from "./app.js?v=5";
    createRoot(document.getElementById("root")).render(React.createElement(Trainingslogboek));
  </script>
</body>
</html>
